name: Pengingat harian

# Memicu POST /api/pengingat setiap hari kerja 08.00 WIB (01.00 UTC). Dibutuhkan bila aplikasi berjalan
# tanpa proses worker (mis. Render paket gratis dengan JOBS_INLINE=1). Atur secret repo:
#   APP_URL      alamat produksi, mis. https://padeknian.onrender.com
#   CRON_SECRET  sama dengan env CRON_SECRET aplikasi (acak, >= 16 karakter)
# Endpoint idempoten: dipicu ulang (mis. dari tombol "Run workflow") tidak mengirim notifikasi ganda.
on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kirim pengingat
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secret APP_URL/CRON_SECRET belum diatur; lewati."
            exit 0
          fi
          # Render paket gratis bisa tertidur: beri waktu bangun (retry sampai ~3 menit).
          curl --fail-with-body --retry 6 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/pengingat"
