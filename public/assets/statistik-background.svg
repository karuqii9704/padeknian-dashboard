<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2427"/>
      <stop offset="1" stop-color="#0c3033"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".22" r=".6">
      <stop offset="0" stop-color="#359FA0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#359FA0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8AD6D1" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#base)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <!-- sumbu dengan tanda skala -->
  <g stroke="#8AD6D1" stroke-opacity=".3" stroke-width="2" fill="none">
    <path d="M120 1040H1480"/>
    <path d="M120 1040V140"/>
  </g>
  <g fill="#FFF0C5" fill-opacity=".35" font-family="Inter, Arial, sans-serif" font-size="18">
    <text x="88" y="1046">0</text>
    <text x="72" y="842">25</text>
    <text x="72" y="644">50</text>
    <text x="72" y="446">75</text>
    <text x="64" y="248">100</text>
  </g>

  <!-- histogram -->
  <g fill="#359FA0" fill-opacity=".38">
    <rect x="200" y="860" width="56" height="180" rx="4"/>
    <rect x="290" y="800" width="56" height="240" rx="4"/>
    <rect x="380" y="840" width="56" height="200" rx="4"/>
    <rect x="470" y="740" width="56" height="300" rx="4"/>
    <rect x="560" y="780" width="56" height="260" rx="4"/>
    <rect x="650" y="700" width="56" height="340" rx="4"/>
    <rect x="740" y="760" width="56" height="280" rx="4"/>
    <rect x="830" y="820" width="56" height="220" rx="4"/>
    <rect x="920" y="690" width="56" height="350" rx="4"/>
    <rect x="1010" y="730" width="56" height="310" rx="4"/>
    <rect x="1100" y="800" width="56" height="240" rx="4"/>
    <rect x="1190" y="850" width="56" height="190" rx="4"/>
  </g>

  <!-- garis tren halus -->
  <path d="M200 760 C 300 700, 360 790, 470 640 S 640 560, 740 620 S 900 470, 1010 520 S 1140 420, 1250 380 S 1380 330, 1440 300"
        fill="none" stroke="#8AD6D1" stroke-width="3" stroke-linecap="round" stroke-opacity=".85"/>
  <path d="M200 860 C 300 830, 380 880, 470 800 S 640 760, 740 800 S 900 700, 1010 720 S 1140 640, 1250 620"
        fill="none" stroke="#FF8C52" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".7" stroke-dasharray="10 8"/>

  <!-- titik data -->
  <g fill="#FFF0C5">
    <circle cx="470" cy="640" r="6" fill-opacity=".85"/>
    <circle cx="740" cy="620" r="6" fill-opacity=".85"/>
    <circle cx="1010" cy="520" r="6" fill-opacity=".85"/>
    <circle cx="1250" cy="380" r="6" fill-opacity=".85"/>
  </g>
  <circle cx="1250" cy="380" r="18" fill="none" stroke="#FF8C52" stroke-width="2" stroke-opacity=".7"/>
</svg>
